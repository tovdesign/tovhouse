    <style>
      :root {
        /* Primary - Fresh Green */
        --green-50: #f2f9f4;
        --green-100: #e0f2e5;
        --green-200: #b8e4c4;
        --green-300: #7ed09a;
        --green-400: #4cb872;
        --green-500: #3a9d5e;
        --green-600: #2f8550;

        /* White & Light */
        --off-white: #fafcfa;
        --light-green: #f5faf6;

        /* Gold Accent */
        --gold: #c9a96e;
        --gold-light: #e8d9b8;
        --gold-hover: #b8964f;
        --gold-bg: #faf6ee;

        /* Warm Neutral */
        --warm-50: #faf9f7;
        --warm-100: #f3f0ea;
        --warm-200: #e6e0d5;
        --warm-300: #c4baa8;
        --warm-400: #9e9484;
        --warm-500: #6b6358;
        --warm-700: #3c3733;

        /* Dark Green (Footer only) */
        --dark-green: #1a3324;

        --font:
          "Pretendard Variable", "Pretendard", -apple-system,
          BlinkMacSystemFont, sans-serif;
        --radius: 16px;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        font-family: var(--font);
        color: var(--warm-500);
        background: var(--warm-50);
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
      }
      img {
        display: block;
        max-width: 100%;
        height: auto;
      }
      a {
        text-decoration: none;
        color: inherit;
      }
      button {
        font-family: inherit;
        cursor: pointer;
        border: none;
      }

      /* ===== NAV ===== */
      .nav {
        position: sticky;
        top: 0;
        z-index: 100;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(12px);
        border-bottom: 1px solid var(--warm-200);
        height: 64px;
      }
      .nav .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 2rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 100%;
      }
      .nav-logo {
        display: flex;
        align-items: center;
      }
      .nav-logo-img {
        height: 44px;
        width: auto;
      }
      .nav-logo-text {
        font-size: 1.15rem;
        font-weight: 700;
        color: #3a9d5e;
        margin-left: 0.5rem;
        letter-spacing: 0.5px;
      }
      .nav-links {
        display: flex;
        gap: 2.5rem;
        list-style: none;
      }
      .nav-links a {
        font-size: 0.875rem;
        font-weight: 500;
        color: var(--warm-500);
        letter-spacing: 1px;
        transition: color 0.3s;
        position: relative;
      }
      .nav-links a:hover,
      .nav-links a.active {
        color: var(--green-500);
      }
      .nav-links a.active::after {
        content: "";
        position: absolute;
        bottom: -4px;
        left: 0;
        right: 0;
        height: 2px;
        background: var(--green-500);
        border-radius: 1px;
      }
      .nav-cta {
        background: var(--green-500);
        color: white;
        padding: 0.5rem 1.25rem;
        border-radius: 8px;
        font-size: 0.875rem;
        font-weight: 600;
        letter-spacing: 0.5px;
        transition:
          background 0.3s,
          transform 0.2s;
      }
      .nav-cta:hover {
        background: var(--green-600);
        transform: translateY(-1px);
      }
      .nav-toggle {
        display: none;
        background: none;
        border: none;
        padding: 0.5rem;
        cursor: pointer;
      }
      .nav-toggle span {
        display: block;
        width: 20px;
        height: 2px;
        background: var(--warm-700);
        margin: 4px 0;
        transition: 0.3s;
      }
      .nav-toggle.open span:nth-child(1) {
        transform: rotate(45deg) translate(4px, 4px);
      }
      .nav-toggle.open span:nth-child(2) {
        opacity: 0;
      }
      .nav-toggle.open span:nth-child(3) {
        transform: rotate(-45deg) translate(4px, -4px);
      }
      .nav-mobile-menu {
        display: none;
        position: absolute;
        top: 64px;
        left: 0;
        right: 0;
        z-index: 999;
        background: rgba(255, 255, 255, 0.98);
        backdrop-filter: blur(12px);
        border-bottom: 1px solid var(--warm-200);
        padding: 1rem 1.5rem;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      }
      .nav-mobile-menu.show {
        display: block;
      }
      .nav-mobile-menu a {
        display: block;
        padding: 0.75rem 0;
        font-size: 0.95rem;
        font-weight: 500;
        color: var(--warm-500);
        border-bottom: 1px solid var(--warm-100);
        transition: color 0.2s;
      }
      .nav-mobile-menu a:last-child {
        border-bottom: none;
      }
      .nav-mobile-menu a:hover,
      .nav-mobile-menu a.active {
        color: var(--green-500);
      }

      /* ===== HERO ===== */
      .detail-hero {
        height: 60vh;
        min-height: 400px;
        max-height: 600px;
        position: relative;
        overflow: hidden;
      }
      .detail-hero img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .detail-hero::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          to bottom,
          rgba(0, 0, 0, 0) 50%,
          rgba(18, 57, 107, 0.7) 100%
        );
      }
      .hero-overlay {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        padding: 3rem;
        z-index: 2;
        color: white;
      }
      .hero-breadcrumb {
        font-size: 0.8rem;
        opacity: 0.7;
        margin-bottom: 0.75rem;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      .hero-breadcrumb a {
        opacity: 0.8;
        transition: opacity 0.3s;
      }
      .hero-breadcrumb a:hover {
        opacity: 1;
      }
      .hero-title {
        font-size: 2.25rem;
        font-weight: 700;
        letter-spacing: 1px;
        margin-bottom: 0.5rem;
      }
      .hero-tags {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
      }
      .hero-tag {
        padding: 0.3rem 0.75rem;
        border-radius: 100px;
        background: rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(4px);
        font-size: 0.75rem;
        font-weight: 500;
        border: 1px solid rgba(255, 255, 255, 0.2);
      }

      /* ===== CONTENT LAYOUT ===== */
      .detail-content {
        max-width: 1200px;
        margin: 0 auto;
        padding: 2.5rem 2rem;
        display: grid;
        grid-template-columns: 320px 1fr;
        gap: 2.5rem;
        align-items: start;
      }

      /* ===== PROJECT INFO SIDEBAR ===== */
      .project-info {
        position: sticky;
        top: 88px;
        background: white;
        border: 1px solid var(--warm-200);
        border-radius: 20px;
        overflow: hidden;
      }
      .info-header {
        background: var(--green-500);
        color: white;
        padding: 1.5rem;
        text-align: center;
      }
      .info-header-label {
        font-size: 0.7rem;
        font-weight: 600;
        letter-spacing: 2px;
        text-transform: uppercase;
        opacity: 0.7;
        margin-bottom: 0.25rem;
      }
      .info-header-title {
        font-size: 1.1rem;
        font-weight: 700;
      }
      .info-grid {
        padding: 1.5rem;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1rem;
      }
      .info-item {
        padding: 0.75rem;
        background: var(--warm-50);
        border-radius: 10px;
      }
      .info-item.full {
        grid-column: 1/-1;
      }
      .info-label {
        font-size: 0.65rem;
        font-weight: 600;
        color: var(--warm-500);
        letter-spacing: 1px;
        text-transform: uppercase;
        margin-bottom: 0.25rem;
      }
      .info-value {
        font-size: 1rem;
        font-weight: 700;
        color: var(--warm-700);
      }
      .info-value.highlight {
        color: var(--green-500);
      }
      .info-divider {
        height: 1px;
        background: var(--warm-200);
        margin: 0 1.5rem;
      }
      .info-cta {
        padding: 1.5rem;
      }
      .info-cta-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        width: 100%;
        padding: 0.875rem;
        background: var(--gold);
        color: white;
        border-radius: 12px;
        font-size: 0.9rem;
        font-weight: 700;
        transition: all 0.3s;
      }
      .info-cta-btn:hover {
        background: var(--gold-hover);
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(196, 162, 101, 0.3);
      }
      .info-phone {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        margin-top: 0.75rem;
        font-size: 0.85rem;
        color: var(--warm-500);
        transition: color 0.3s;
      }
      .info-phone:hover {
        color: var(--green-500);
      }

      /* ===== GALLERY ===== */
      .gallery {
        display: flex;
        flex-direction: column;
        gap: 2.5rem;
      }
      .gallery-section-title {
        font-size: 0.75rem;
        font-weight: 600;
        color: var(--green-500);
        letter-spacing: 2px;
        text-transform: uppercase;
        margin-bottom: 1rem;
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }
      .gallery-section-title::after {
        content: "";
        flex: 1;
        height: 1px;
        background: var(--warm-200);
      }
      .gallery-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 0.75rem;
      }
      .gallery-item {
        border-radius: var(--radius);
        overflow: hidden;
        cursor: pointer;
        position: relative;
        aspect-ratio: 4/3;
        background: var(--warm-200);
      }
      .gallery-item img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.5s;
      }
      .gallery-item:hover img {
        transform: scale(1.05);
      }
      .gallery-item.large {
        grid-column: 1/-1;
        aspect-ratio: 16/9;
      }
      .gallery-item::after {
        content: "";
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0);
        transition: background 0.3s;
      }
      .gallery-item:hover::after {
        background: rgba(18, 57, 107, 0.1);
      }
      .gallery-zoom {
        position: absolute;
        bottom: 0.75rem;
        right: 0.75rem;
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.9);
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        transition: opacity 0.3s;
        z-index: 2;
        color: var(--green-500);
      }
      .gallery-item:hover .gallery-zoom {
        opacity: 1;
      }

      /* ===== PROJECT DESCRIPTION ===== */
      .project-desc {
        background: white;
        border: 1px solid var(--warm-200);
        border-radius: var(--radius);
        padding: 2rem;
      }
      .project-desc h3 {
        font-size: 1.1rem;
        font-weight: 700;
        color: var(--warm-700);
        margin-bottom: 1rem;
      }
      .project-desc p {
        font-size: 0.9rem;
        line-height: 1.8;
        color: var(--warm-500);
      }

      /* ===== RELATED PROJECTS ===== */
      .related {
        padding: 4rem 0;
        background: var(--warm-100);
      }
      .related-inner {
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 2rem;
      }
      .related-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 2rem;
      }
      .related-title {
        font-size: 1.25rem;
        font-weight: 700;
        color: var(--warm-700);
      }
      .related-more {
        font-size: 0.85rem;
        color: var(--green-500);
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 0.25rem;
      }
      .related-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: var(--radius);
      }
      .related-card {
        border-radius: var(--radius);
        overflow: hidden;
        background: white;
        border: 1px solid var(--warm-200);
        transition: all 0.3s;
        cursor: pointer;
      }
      .related-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.06);
      }
      .related-card-img {
        height: 180px;
        overflow: hidden;
      }
      .related-card-img img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.5s;
      }
      .related-card:hover .related-card-img img {
        transform: scale(1.08);
      }
      .related-card-body {
        padding: 1rem;
      }
      .related-card-title {
        font-size: 0.85rem;
        font-weight: 600;
        color: var(--warm-700);
        margin-bottom: 0.5rem;
      }
      .related-card-meta {
        display: flex;
        gap: 0.5rem;
      }
      .related-tag {
        font-size: 0.65rem;
        padding: 0.2rem 0.5rem;
        border-radius: 4px;
        background: var(--green-50);
        color: var(--green-500);
        font-weight: 500;
      }

      /* ===== BOTTOM CTA ===== */
      .bottom-cta {
        background: var(--green-600);
        color: white;
        padding: 4rem 0;
        text-align: center;
      }
      .bottom-cta-inner {
        max-width: 600px;
        margin: 0 auto;
        padding: 0 2rem;
      }
      .bottom-cta h2 {
        font-size: 1.75rem;
        font-weight: 700;
        margin-bottom: 0.5rem;
      }
      .bottom-cta p {
        font-size: 0.95rem;
        opacity: 0.6;
        margin-bottom: 2rem;
      }
      .bottom-cta-btns {
        display: flex;
        gap: 1rem;
        justify-content: center;
        flex-wrap: wrap;
      }
      .cta-btn-primary {
        padding: 0.875rem 2.5rem;
        border-radius: 12px;
        background: var(--gold);
        color: white;
        font-size: 0.95rem;
        font-weight: 700;
        transition: all 0.3s;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      .cta-btn-primary:hover {
        background: var(--gold-hover);
        transform: translateY(-2px);
      }
      .cta-btn-secondary {
        padding: 0.875rem 2rem;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.1);
        color: white;
        font-size: 0.95rem;
        font-weight: 500;
        border: 1px solid rgba(255, 255, 255, 0.2);
        transition: all 0.3s;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      .cta-btn-secondary:hover {
        background: rgba(255, 255, 255, 0.2);
      }

      /* ===== FOOTER ===== */
      .footer {
        background: var(--warm-700);
        color: rgba(255, 255, 255, 0.6);
        padding: 3rem 0;
      }
      .footer .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 2rem;
      }
      .footer-grid {
        display: grid;
        grid-template-columns: 1.5fr 1fr 1fr;
        gap: 3rem;
      }
      .footer-brand {
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }
      .footer-logo {
        font-family: var(--font);
        font-size: 1.25rem;
        font-weight: 600;
        color: white;
        letter-spacing: 3px;
      }
      .footer-desc {
        font-size: 0.85rem;
        line-height: 1.7;
        color: rgba(255, 255, 255, 0.55);
      }
      .footer-heading {
        font-size: 0.75rem;
        font-weight: 600;
        color: rgba(255, 255, 255, 0.7);
        letter-spacing: 2px;
        text-transform: uppercase;
        margin-bottom: 1rem;
      }
      .footer-info {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        font-size: 0.85rem;
      }
      .footer-info a {
        transition: color 0.3s;
      }
      .footer-info a:hover {
        color: white;
      }
      .footer-phone {
        font-family: var(--font);
        font-size: 1.25rem;
        font-weight: 600;
        color: white;
        letter-spacing: 1px;
      }
      .footer-bottom {
        margin-top: 2rem;
        padding-top: 1.5rem;
        border-top: 1px solid rgba(255, 255, 255, 0.12);
        font-size: 0.75rem;
        opacity: 0.7;
        display: flex;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 0.5rem;
      }
      .footer-links a {
        color: rgba(255, 255, 255, 0.7);
        text-decoration: none;
        transition: color 0.3s;
      }
      .footer-links a:hover {
        color: rgba(255, 255, 255, 1);
      }
      @media (max-width: 768px) {
        .footer-grid {
          grid-template-columns: 1fr;
          gap: 2rem;
        }
        .footer-bottom {
          flex-direction: column;
          gap: 0.5rem;
        }
      }

      /* ===== LIGHTBOX ===== */
      .lightbox {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 200;
        background: rgba(0, 0, 0, 0.95);
        align-items: center;
        justify-content: center;
        padding: 2rem;
      }
      .lightbox.open {
        display: flex;
      }
      .lightbox img {
        max-width: 90vw;
        max-height: 85vh;
        object-fit: contain;
        border-radius: 8px;
      }
      .lightbox-close {
        position: absolute;
        top: 1.5rem;
        right: 1.5rem;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.1);
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.5rem;
        transition: background 0.3s;
        cursor: pointer;
      }
      .lightbox-close:hover {
        background: rgba(255, 255, 255, 0.2);
      }
      .lightbox-nav {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.1);
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.3s;
        cursor: pointer;
      }
      .lightbox-nav:hover {
        background: rgba(255, 255, 255, 0.2);
      }
      .lightbox-prev {
        left: 1.5rem;
      }
      .lightbox-next {
        right: 1.5rem;
      }
      .lightbox-counter {
        position: absolute;
        bottom: 1.5rem;
        left: 50%;
        transform: translateX(-50%);
        color: rgba(255, 255, 255, 0.5);
        font-size: 0.85rem;
      }

      /* ===== RESPONSIVE ===== */
      @media (max-width: 1024px) {
        .nav-links {
          display: none;
        }
        .nav-toggle {
          display: block;
        }
        .nav-cta {
          display: none;
        }
        .detail-content {
          grid-template-columns: 1fr;
          gap: 1.5rem;
        }
        .project-info {
          position: static;
          order: -1;
        }
        .info-grid {
          grid-template-columns: repeat(3, 1fr);
        }
        .related-grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }
      @media (max-width: 768px) {
        .detail-hero {
          height: 45vh;
          min-height: 300px;
        }
        .hero-overlay {
          padding: 1.5rem;
        }
        .hero-title {
          font-size: 1.5rem;
        }
        .detail-content {
          padding: 1.5rem 1.25rem;
        }
        .info-grid {
          grid-template-columns: 1fr 1fr;
        }
        .gallery-grid {
          grid-template-columns: 1fr;
        }
        .gallery-item {
          aspect-ratio: 3/2;
        }
        .gallery-item.large {
          aspect-ratio: 16/10;
        }
        .related-grid {
          grid-template-columns: 1fr 1fr;
        }
        .bottom-cta-btns {
          flex-direction: column;
          align-items: center;
        }
      }
      @media (max-width: 480px) {
        .related-grid {
          grid-template-columns: 1fr;
        }
      }

      /* ===== ANIMATION ===== */
      .fade-in {
        opacity: 0;
        transform: translateY(20px);
        transition:
          opacity 0.6s ease,
          transform 0.6s ease;
      }
      .fade-in.visible {
        opacity: 1;
        transform: translateY(0);
      }
      /* ========== LOADING SCREEN ========== */
      .loading-screen {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: var(--warm-50);
        display: flex;
        align-items: center;
        justify-content: center;
        transition:
          opacity 0.6s ease,
          visibility 0.6s ease;
      }
      .loading-screen.hide {
        opacity: 0;
        visibility: hidden;
      }
      .loading-inner {
        text-align: center;
        width: 280px;
      }
      .loading-logo-text {
        font-size: 32px;
        font-weight: 700;
        letter-spacing: 8px;
        color: var(--green-500);
      }
      .loading-tagline {
        font-size: 10px;
        letter-spacing: 6px;
        color: var(--gold);
        margin-top: 6px;
        text-transform: uppercase;
      }
      .loading-track {
        width: 100%;
        height: 1.5px;
        background: var(--warm-200);
        margin-top: 40px;
        border-radius: 1px;
        overflow: visible;
        position: relative;
      }
      .loading-bar {
        height: 100%;
        width: 0;
        background: var(--gold);
        border-radius: 1px;
        animation: loadProgress 2.6s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }
      .loading-glow {
        position: absolute;
        top: -3px;
        width: 20px;
        height: 8px;
        background: radial-gradient(
          ellipse,
          rgba(196, 162, 101, 0.6),
          transparent
        );
        animation: loadGlow 2.6s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        opacity: 0;
      }
      .loading-status {
        font-size: 11px;
        color: var(--warm-300);
        margin-top: 16px;
        letter-spacing: 1px;
      }
      .loading-dots span {
        animation: loadDot 1.4s infinite;
      }
      .loading-dots span:nth-child(2) {
        animation-delay: 0.2s;
      }
      .loading-dots span:nth-child(3) {
        animation-delay: 0.4s;
      }
      @keyframes loadProgress {
        0% {
          width: 0;
        }
        100% {
          width: 100%;
        }
      }
      @keyframes loadGlow {
        0% {
          opacity: 0;
          left: 0;
        }
        8% {
          opacity: 1;
        }
        92% {
          opacity: 1;
        }
        100% {
          opacity: 0;
          left: calc(100% - 20px);
        }
      }
      @keyframes loadDot {
        0%,
        60%,
        100% {
          opacity: 0.3;
        }
        30% {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <!-- ===== LOADING SCREEN ===== -->

    <!-- NAV -->
    <nav class="nav">

      </div>
      <div class="nav-mobile-menu" id="mobileMenu">
        <a href="index.html">홈</a>
        <a href="about.html">회사소개</a>
        <a href="portfolio.html" class="active">시공사례</a>

    <!-- Dynamic content rendered by JS -->

    <!-- LIGHTBOX -->
    <div class="lightbox" id="lightbox" onclick="closeLightbox(event)">
      <div class="lightbox-close" onclick="closeLightbox()">

        >

        class="lightbox-nav lightbox-next"
        onclick="
          event.stopPropagation();

      >

          width="20"
          height="20"
          fill="none"
          stroke="currentColor"

          stroke-linecap="round"
        >
          <path d="M8 4l6 6-6 6" />
        </svg>
      </div>
      <div class="lightbox-counter" id="lightbox-counter"></div>
    </div>

    <script>
      // ===== DYNAMIC PORTFOLIO DETAIL =====
      const API_BASE = "https://admin.tovdesign.net";
      let allImages = [];
      let currentIdx = 0;

      function parseTitle(title) {
        // "서울 성북구 석관동 아파트 49평" or "지역|유형|평수"
        if (!title) return { region: "", type: "", area: "" };
        if (title.includes("|")) {
          const [region, type, area] = title.split("|");
          return { region: region || "", type: type || "", area: area || "" };
        }
        // Try to parse Korean address pattern
        const match = title.match(
          /^(.+?)\s+(아파트|빌라|주택|오피스텔|사무실|카페|식당|매장|상가)\s*(.*)$/,
        );
        if (match) return { region: match[1], type: match[2], area: match[3] };
        return { region: title, type: "", area: "" };
      }

      // XSS 방어: 외부 데이터(API/JSON) 삽입 전 이스케이프
      function esc(v) {
        if (v === null || v === undefined) return "";
        return String(v)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }
      function safeUrl(u) {
        if (!u) return "";
        const s = String(u).trim();
        if (/^(javascript|data|vbscript|file):/i.test(s)) return "";
        return esc(s);
      }

      function buildBlocksHTML(blocks, startIdx) {
        let html = "";
        let imgIdx = startIdx;
        const zoomSvg =
          '<div class="gallery-zoom"><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="7" cy="7" r="5"/><path d="M11 11l3 3"/></svg></div>';

        blocks.forEach((block) => {
          if (!block.images || !block.images.length) return;
          html += '<div class="fade-in">';
          html +=
            '<div class="gallery-section-title">' +
            esc(block.title || "시공 사진") +
            " · Photos</div>";

          const count = block.images.length;
          let gridClass = "gallery-grid";
          html += '<div class="' + gridClass + '">';
          block.images.forEach((src, j) => {
            const isLarge = count <= 2 && j === 0 ? " large" : "";
            html +=
              '<div class="gallery-item' +
              isLarge +
              '" onclick="openLightbox(' +
              imgIdx +
              ')"><img src="' +
              safeUrl(src) +
              '" alt="시공 사진" loading="' +
              (imgIdx < 3 ? "eager" : "lazy") +
              '">' +
              zoomSvg +
              "</div>";
            imgIdx++;
          });
          html += "</div></div>";
        });
        return { html, totalImages: imgIdx };
      }

      function buildReceiptHTML(receiptData, receiptImage) {
        if (!receiptData) return "";
        let items = [];
        try {
          items = JSON.parse(receiptData);
        } catch (e) {
          return "";
        }
        if (!items.length) return "";

        const total = items.reduce(
          (s, i) =>
            s + (parseInt(String(i.amount).replace(/[^0-9]/g, "")) || 0),
          0,
        );
        let rows = items
          .map(
            (i) =>
              '<tr><td style="padding:10px 14px;border-bottom:1px solid var(--warm-200)">' +
              (i.item || "") +
              '</td><td style="padding:10px 14px;border-bottom:1px solid var(--warm-200);text-align:right;font-weight:600">' +
              (i.amount || "") +
              "</td></tr>",
          )
          .join("");

        return (
          '<div class="fade-in" style="margin-top:1rem">' +
          '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem">' +
          '<div class="gallery-section-title" style="margin-bottom:0">투명한 실비 내역서 · Cost Breakdown</div>' +
          (receiptImage
            ? '<a href="' +
              receiptImage +
              '" onclick="event.preventDefault();openReceiptLightbox(\'' +
              receiptImage +
              '\')" style="font-size:0.8rem;color:var(--green-500);font-weight:600;cursor:pointer">원본 확인하기 →</a>'
            : "") +
          "</div>" +
          '<div style="background:#fff;border:1px solid var(--warm-200);border-radius:var(--radius);overflow:hidden">' +
          '<table style="width:100%;border-collapse:collapse;font-size:0.9rem">' +
          '<thead><tr style="background:var(--green-500);color:#fff"><th style="padding:10px 14px;text-align:left;font-weight:600">항목</th><th style="padding:10px 14px;text-align:right;font-weight:600">금액</th></tr></thead>' +
          "<tbody>" +
          rows +
          '<tr style="background:var(--warm-100)"><td style="padding:12px 14px;font-weight:700">합계</td><td style="padding:12px 14px;text-align:right;font-weight:700;color:var(--green-500);font-size:1.1rem">' +
          total.toLocaleString() +
          "원</td></tr>" +
          "</tbody>" +
          "</table>" +
          "</div>" +
          "</div>"
        );
      }

      async function loadFromAPI(id) {
        const res = await fetch(
          API_BASE + "/api/portfolio?id=" + encodeURIComponent(id),
        );
        if (!res.ok) throw new Error("API " + res.status);
        const data = await res.json();
        return data.item;
      }

      async function loadFromJSON(rawId, type) {
        const res = await fetch("portfolio-data.json");
        const data = await res.json();
        const list = data[type] || data.residential;
        const item =
          list.find((i) => String(i.id) === rawId) ||
          list.find((i) => i.id === parseInt(rawId)) ||
          list[0];
        // Convert to API format
        const parsed = parseTitle(
          item.title || item.region + "|" + item.type + "|" + item.area,
        );
        return {
          id: item.id,
          title: item.title || item.region + " " + item.type + " " + item.area,
          cat: type === "commercial" ? "상업공간" : "주거공간",
          img:
            item.thumbnail ||
            "assets/portfolio/thumbnails/" + item.id + ".webp",
          images: item.detailImages || [],
          content: "",
          blocks: "",
          receipt_image: "",
          receipt_data: "",
          _parsed: {
            region: item.region,
            type: item.type,
            area: item.area,
            duration: item.duration,
            cost: item.cost,
          },
        };
      }

      async function init() {
        const params = new URLSearchParams(window.location.search);
        const rawId = params.get("id") || "1";
        const type = params.get("type") || "residential";

        try {
          let item;
          let parsed;
          let allItems = [];

          // Try API first (Airtable record ID starts with 'rec')
          if (rawId.startsWith("rec")) {
            item = await loadFromAPI(rawId);
            parsed = parseTitle(item.title);
            // Load all items for related section
            try {
              const allRes = await fetch(API_BASE + "/api/portfolio");
              const allData = await allRes.json();
              allItems = (allData.items || []).filter(
                (i) => i.id !== item.id && i.visible !== false,
              );
            } catch (e) {}
          } else {
            // Fallback to JSON
            item = await loadFromJSON(rawId, type);
            parsed = item._parsed || parseTitle(item.title);
            try {
              const jsonRes = await fetch("portfolio-data.json");
              const jsonData = await jsonRes.json();
              allItems = [
                ...(jsonData.residential || []),
                ...(jsonData.commercial || []),
              ].filter((i) => String(i.id) !== rawId);
            } catch (e) {}
          }

          const region = item.region || parsed.region || "";
          const spaceType = item.spaceType || parsed.type || "";
          const area = item.area || parsed.area || "";
          const duration = item.duration || parsed.duration || "";
          const cost = item.cost || parsed.cost || "";
          const category = item.cat || "주거공간";
          const thumbUrl = item.img || "";
          const content = item.content || "";

          // Build blocks
          let blocks = [];
          if (item.blocks) {
            try {
              blocks = JSON.parse(item.blocks);
            } catch (e) {}
          }
          if (!blocks.length && item.images && item.images.length) {
            // Legacy: flat images → single block
            blocks = [{ title: "시공 사진", images: item.images }];
          }

          const { html: blocksHTML } = buildBlocksHTML(blocks, 0);
          const receiptHTML = buildReceiptHTML(
            item.receipt_data,
            item.receipt_image,
          );

          // Related (pick 4 random)
          const related = allItems.sort(() => Math.random() - 0.5).slice(0, 4);
          let relatedHTML = "";
          related.forEach((r, i) => {
            const rParsed = parseTitle(r.title);
            const rThumb = r.img || r.thumbnail || "";
            const rId = String(r.id || "");
            const rLink = rId.startsWith("rec")
              ? "portfolio-detail.html?id=" + encodeURIComponent(rId)
              : "portfolio-detail.html?id=" +
                encodeURIComponent(rId) +
                "&type=" +
                encodeURIComponent(type);
            relatedHTML +=
              '<a href="' +
              esc(rLink) +
              '" class="related-card fade-in" style="transition-delay:' +
              i * 0.1 +
              's">' +
              '<div class="related-card-img"><img src="' +
              safeUrl(rThumb) +
              '" alt="' +
              esc(rParsed.region || "") +
              '" loading="lazy"></div>' +
              '<div class="related-card-body"><div class="related-card-title">' +
              esc((rParsed.region || "") + " " + (rParsed.area || "")) +
              "</div>" +
              '<div class="related-card-meta"><span class="related-tag">' +
              esc(rParsed.type || r.cat || "") +
              "</span>" +
              (rParsed.area
                ? '<span class="related-tag">' + esc(rParsed.area) + "</span>"
                : "") +
              "</div></div></a>";
          });

          // Description text
          const descText =
            content ||
            region +
              " " +
              area +
              " " +
              spaceType +
              " 리모델링 시공 사례입니다. 고객님의 취향에 맞춘 맞춤형 디자인으로 공간을 새롭게 변화시켰습니다. 자재는 고객님이 직접 선택하시고, 토브하우스가 투명한 견적으로 시공을 완료했습니다.";

          document.getElementById("app-root").innerHTML =
            '<section class="detail-hero">' +
            '<img src="' +
            safeUrl(thumbUrl) +
            '" alt="' +
            esc(region + " " + area) +
            ' 리모델링">' +
            '<div class="hero-overlay">' +
            '<div class="hero-breadcrumb"><a href="index.html">홈</a> <span>›</span> <a href="portfolio.html">포트폴리오</a> <span>›</span> <span>' +
            esc(category) +
            "</span></div>" +
            '<h1 class="hero-title">' +
            esc(region + " " + area) +
            "</h1>" +
            '<div class="hero-tags"><span class="hero-tag">' +
            esc(spaceType) +
            '</span><span class="hero-tag">' +
            esc(category) +
            "</span>" +
            (area ? '<span class="hero-tag">' + esc(area) + "</span>" : "") +
            "</div>" +
            "</div>" +
            "</section>" +
            '<div class="detail-content">' +
            '<aside class="project-info fade-in">' +
            '<div class="info-header"><div class="info-header-label">Project Info</div><div class="info-header-title">' +
            esc(region || "리모델링") +
            "</div></div>" +
            '<div class="info-grid">' +
            '<div class="info-item"><div class="info-label">지역</div><div class="info-value">' +
            esc(region || "-") +
            "</div></div>" +
            '<div class="info-item"><div class="info-label">공간 유형</div><div class="info-value">' +
            esc(spaceType || "-") +
            "</div></div>" +
            (area
              ? '<div class="info-item"><div class="info-label">면적</div><div class="info-value highlight">' +
                esc(area) +
                "</div></div>"
              : "") +
            (duration
              ? '<div class="info-item"><div class="info-label">시공 기간</div><div class="info-value">' +
                esc(duration) +
                "</div></div>"
              : "") +
            (cost
              ? '<div class="info-item full"><div class="info-label">시공 비용</div><div class="info-value highlight" style="font-size:1.25rem">' +
                esc(cost) +
                "만원</div></div>"
              : "") +
            "</div>" +
            '<div class="info-divider"></div>' +
            '<div class="info-cta">' +
            '<a href="estimate.html" class="info-cta-btn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg> 유사 견적 요청하기</a>' +
            '<a href="tel:03196822224" class="info-phone"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/></svg> 031-968-2224</a>' +
            "</div>" +
            "</aside>" +
            '<div class="gallery">' +
            '<div class="project-desc fade-in"><h3>프로젝트 소개</h3><p>' +
            esc(descText).replace(/\n/g, "<br>") +
            "</p></div>" +
            blocksHTML +
            receiptHTML +
            "</div>" +
            "</div>" +
            '<section class="related"><div class="related-inner">' +
            '<div class="related-header"><h2 class="related-title">다른 시공 사례</h2><a href="portfolio.html" class="related-more">전체보기 <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 3l4 4-4 4"/></svg></a></div>' +
            '<div class="related-grid">' +
            relatedHTML +
            "</div>" +
            "</div></section>" +
            '<section class="bottom-cta"><div class="bottom-cta-inner">' +

          // Dynamic SEO meta update (defensive — create if missing)
          function setMeta(selector, attr, val) {
            let el = document.querySelector(selector);
            if (!el) {
              el = document.createElement("meta");
              const m = selector.match(/\[(property|name)="([^"]+)"\]/);
              if (m) el.setAttribute(m[1], m[2]);
              document.head.appendChild(el);
            }
            el.setAttribute(attr, val);
          }
          setMeta(
            'meta[property="og:title"]',
            "content",
            item.title + " | 토브하우스",
          );
          setMeta(
            'meta[property="og:description"]',
            "content",
            item.title + " 시공사례. 토브하우스 투명한 견적, 맞춤 인테리어.",
          );
          setMeta(
            'meta[property="og:url"]',
            "content",
            "https://tovdesign.net/portfolio-detail?id=" +
              encodeURIComponent(item.id) +
              "&type=" +
              encodeURIComponent(
                item.category || item.cat || type || "residential",
              ),
          );
          setMeta(
            'meta[name="description"]',
            "content",
            item.title +
              " 인테리어 리모델링 시공사례. 투명한 견적과 맞춤 디자인 - 토브하우스",
          );
          // Dynamic canonical update
          var canonicalLink = document.querySelector('link[rel="canonical"]');
          if (!canonicalLink) {
            canonicalLink = document.createElement("link");
            canonicalLink.setAttribute("rel", "canonical");
            document.head.appendChild(canonicalLink);
          }
          canonicalLink.setAttribute(
            "href",
            "https://tovdesign.net/portfolio-detail?id=" +
              encodeURIComponent(item.id) +
              "&type=" +
              encodeURIComponent(
                item.category || item.cat || type || "residential",
              ),
          );

          allImages = [...document.querySelectorAll(".gallery-item img")].map(
            (i) => i.src,
          );

          // IntersectionObserver 지원 + 일찍 발동(rootMargin) + threshold 0
          // 추가로 200ms 안에 첫 화면 요소는 즉시 visible 처리
          const fadeEls = document.querySelectorAll(".fade-in");
          if ("IntersectionObserver" in window) {
            const obs = new IntersectionObserver(
              (entries, o) => {
                entries.forEach((e) => {
                  if (e.isIntersecting) {
                    e.target.classList.add("visible");
                    o.unobserve(e.target);
                  }
                });
              },
              { threshold: 0, rootMargin: "0px 0px 200px 0px" },
            );
            fadeEls.forEach((el) => obs.observe(el));
            // 안전장치: 혹시 observer가 발동 안 하는 경우 1.5초 뒤 모두 visible 처리
            setTimeout(() => {
              fadeEls.forEach((el) => el.classList.add("visible"));
            }, 1500);
          } else {
            // IO 미지원 환경 (구형 브라우저) → 즉시 visible
            fadeEls.forEach((el) => el.classList.add("visible"));
          }
        } catch (err) {
          console.error("Failed to load portfolio data:", err);

            '<div style="text-align:center;padding:6rem 2rem"><h2 style="color:var(--warm-700);margin-bottom:1rem">데이터를 불러올 수 없습니다</h2><p style="color:var(--warm-500)">잠시 후 다시 시도해 주세요</p><a href="portfolio.html" style="display:inline-block;margin-top:1.5rem;padding:0.75rem 2rem;background:var(--green-500);color:white;border-radius:12px">포트폴리오로 돌아가기</a></div>';
        }
      }

      function openReceiptLightbox(url) {
        document.getElementById("lightbox-img").src = url;
        document.getElementById("lightbox-counter").textContent =
          "실행내역서 원본";
        document.getElementById("lightbox").classList.add("open");
        document.body.style.overflow = "hidden";
      }

      // Lightbox
      function openLightbox(idx) {
        currentIdx = idx;
        document.getElementById("lightbox-img").src = allImages[idx];
        document.getElementById("lightbox-counter").textContent =
          `${idx + 1} / ${allImages.length}`;
        document.getElementById("lightbox").classList.add("open");
        document.body.style.overflow = "hidden";
      }
      function closeLightbox(e) {
        if (
          e &&
          e.target !== e.currentTarget &&
          !e.target.closest(".lightbox-close")
        )
          return;
        document.getElementById("lightbox").classList.remove("open");
        document.body.style.overflow = "";
      }
      function navLightbox(dir) {
        currentIdx = (currentIdx + dir + allImages.length) % allImages.length;
        document.getElementById("lightbox-img").src = allImages[currentIdx];
        document.getElementById("lightbox-counter").textContent =
          `${currentIdx + 1} / ${allImages.length}`;
      }
      document.addEventListener("keydown", (e) => {
        if (!document.getElementById("lightbox").classList.contains("open"))
          return;
        if (e.key === "Escape") closeLightbox();
        if (e.key === "ArrowLeft") navLightbox(-1);
        if (e.key === "ArrowRight") navLightbox(1);
      });

      init();

    <script>
      (function () {
        var ls = document.getElementById("loadingScreen");
        if (!ls) return;
        var loaded = false,
          timerDone = false;
        function dismiss() {
          if (!loaded || !timerDone) return;
          ls.classList.add("hide");
          setTimeout(function () {
            ls.remove();
          }, 600);
        }
        window.addEventListener("load", function () {
          loaded = true;
          dismiss();
        });
        setTimeout(function () {
          timerDone = true;
          dismiss();
        }, 2800);
      })();
