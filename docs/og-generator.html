<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1200" />
    <title>OG Image Generator</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #888;
        display: flex;
        justify-content: center;
        padding: 40px;
      }
      .og {
        width: 1200px;
        height: 630px;
        background: linear-gradient(
          135deg,
          #12396b 0%,
          #1d55a0 50%,
          #174785 100%
        );
        position: relative;
        overflow: hidden;
        font-family: "Pretendard Variable", "Pretendard", sans-serif;
      }
      /* Subtle pattern overlay */
      .og::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          radial-gradient(
            circle at 20% 80%,
            rgba(196, 162, 101, 0.08) 0%,
            transparent 50%
          ),
          radial-gradient(
            circle at 80% 20%,
            rgba(255, 255, 255, 0.05) 0%,
            transparent 40%
          );
      }
      /* Geometric accent lines */
      .line1 {
        position: absolute;
        top: 0;
        right: 0;
        width: 500px;
        height: 630px;
        border-left: 1px solid rgba(196, 162, 101, 0.15);
        transform: skewX(-15deg);
        transform-origin: top right;
      }
      .line2 {
        position: absolute;
        top: 0;
        right: 80px;
        width: 500px;
        height: 630px;
        border-left: 1px solid rgba(196, 162, 101, 0.08);
        transform: skewX(-15deg);
        transform-origin: top right;
      }
      /* Bottom gold accent */
      .gold-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 6px;
        background: linear-gradient(90deg, #c4a265, #d4b87a, #c4a265);
      }
      /* Content */
      .content {
        position: relative;
        z-index: 1;
        padding: 80px 90px;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .logo-area {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-bottom: 40px;
      }
      .logo-icon {
        width: 56px;
        height: 56px;
        border: 2px solid rgba(196, 162, 101, 0.5);
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(255, 255, 255, 0.05);
      }
      .logo-icon img {
        width: 40px;
        height: auto;
      }
      .logo-text {
        font-size: 28px;
        font-weight: 800;
        letter-spacing: 6px;
        color: #fff;
      }
      .logo-text span {
        color: #c4a265;
      }
      .main-title {
        font-size: 76px;
        font-weight: 800;
        color: #fff;
        line-height: 1.3;
        letter-spacing: -1px;
        margin-bottom: 24px;
      }
      .main-title em {
        font-style: normal;
        color: #c4a265;
      }
      .sub-text {
        font-size: 26px;
        color: rgba(255, 255, 255, 0.6);
        font-weight: 400;
        letter-spacing: 0.5px;
      }
      .domain {
        position: absolute;
        bottom: 28px;
        right: 90px;
        font-size: 16px;
        color: rgba(255, 255, 255, 0.35);
        letter-spacing: 2px;
        font-weight: 500;
      }
      /* House icon for logo area */
      .house-icon {
        width: 36px;
        height: 36px;
      }
    </style>
  </head>
  <body>
    <div class="og">
      <div class="line1"></div>
      <div class="line2"></div>
      <div class="gold-bar"></div>
      <div class="content">
        <div class="logo-area">
          <div class="logo-icon">
            <svg
              class="house-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="#c4a265"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
              <polyline points="9 22 9 12 15 12 15 22" />
            </svg>
          </div>
          <div class="logo-text"><span>TOV</span> DESIGN</div>
        </div>
        <div class="main-title">
          인테리어 <em>원가공개</em><br />
          전공정 <em>실행내역서</em> 제공
        </div>
        <div class="sub-text">투명한 견적 · 주거·상업 공간 리모델링 전문</div>
      </div>
      <div class="domain">tovdesign.net</div>
    </div>
  </body>
</html>
